name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Offline tests (no database, no network)
        run: python -m unittest discover -s tests -t .
      - name: Build and check the extension bundle
        run: |
          python tools/build_mcpb.py
          $bundle = (Get-ChildItem dist\*.mcpb | Select-Object -First 1).FullName
          python tools/check_bundle.py $bundle
